# Local development services. Credentials come from .env (see .env.example).
name: agent-dashboard

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      # Bound to localhost only so the database is never exposed to the LAN.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username postgres --dbname agent_dashboard']
      interval: 5s
      timeout: 3s
      retries: 10

  # The only way out of the sandbox network: HTTPS CONNECT tunnels to the
  # provider API hosts listed below, nothing else (see D-023).
  egress-proxy:
    build: ./apps/egress-proxy
    image: agent-dashboard/egress-proxy:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-api.anthropic.com,api.openai.com}
    networks:
      sandbox:
        aliases: [egress-proxy]
      egress: {}

networks:
  # Agent sandboxes join this network. `internal` means Docker gives it no
  # route to the host's network or the internet.
  sandbox:
    name: agent-dashboard-sandbox
    internal: true
  egress:
    name: agent-dashboard-egress

volumes:
  postgres-data:
